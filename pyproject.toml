[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careercrew"
version = "0.1.0"
description = "Multi-agent career intelligence and resume tailoring platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "jinja2>=3.1.2",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
