services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: careercrew-api-prod
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - careercrew-prod-network

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: careercrew-ui-prod
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - careercrew-prod-network

networks:
  careercrew-prod-network:
    driver: bridge
